[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightagent"
version = "5.0.0"
description = "InsightAgent V5.0"
requires-python = ">=3.10"
dependencies = [
    "filelock>=3.0",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
    "langchain-mcp-adapters>=0.2",
    "langchain-openai>=1.0",
    "langfuse>=3,<4",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout>=2"]

[project.scripts]
insightagent = "insightagent.cli.main:main"
insightagent-run = "insightagent.cli.run_task:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--ignore=tests/fixtures"]
pythonpath = ["src", "."]
testpaths = ["tests"]
