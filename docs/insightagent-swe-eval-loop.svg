<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="770" viewBox="0 0 1600 770" font-family="PingFang SC, STHeiti, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2540" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="770" fill="#f5f8fc"/>

  <text x="40" y="46" font-size="27" font-weight="700" fill="#0f2540">创新点三：证据驱动的评测闭环——“完成”必须可回放、可审计</text>
  <text x="40" y="74" font-size="15" fill="#5b6b80">问题 → 五步契约逐项阻断 → 证据留档：只有带证据的“完成”才计入 resolved</text>

  <!-- Problem band -->
  <g filter="url(#shadow)">
    <rect x="40" y="94" width="1520" height="90" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  </g>
  <text x="62" y="147" font-size="15.5" font-weight="700" fill="#9f1239">问题：Agent 评测普遍存在证据污染</text>
  <g font-size="13" text-anchor="middle">
    <rect x="430" y="119" width="212" height="40" rx="20" fill="#ffffff" stroke="#e11d48"/>
    <text x="536" y="144" fill="#be123c">✕ baseline 未确认失败</text>
    <rect x="662" y="119" width="186" height="40" rx="20" fill="#ffffff" stroke="#e11d48"/>
    <text x="755" y="144" fill="#be123c">✕ 修改测试制造通过</text>
    <rect x="868" y="119" width="156" height="40" rx="20" fill="#ffffff" stroke="#e11d48"/>
    <text x="946" y="144" fill="#be123c">✕ 结果不可复现</text>
  </g>
  <text x="1056" y="147" font-size="13.5" fill="#9f1239">⇒ “完成”沦为模型自我声明，结论不可信</text>

  <line x1="800" y1="184" x2="800" y2="210" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="816" y="204" font-size="13" font-weight="700" fill="#334155">五步契约 · 逐项阻断</text>

  <!-- Step cards -->
  <g filter="url(#shadow)">
    <rect x="40" y="214" width="284" height="286" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="40" y="214" width="284" height="34" rx="10" fill="#2563eb"/>
    <rect x="40" y="234" width="284" height="14" fill="#2563eb"/>
  </g>
  <text x="58" y="237" font-size="15" font-weight="700" fill="#ffffff">① 固定实验条件</text>
  <text x="58" y="282" font-size="13.5" fill="#1f2b3a">固定 issue 与仓库 checkout</text>
  <text x="58" y="310" font-size="13.5" fill="#1f2b3a">固定验证命令与模型配置</text>
  <text x="58" y="338" font-size="13.5" fill="#1f2b3a">同一口径，任何人可重跑</text>
  <rect x="56" y="432" width="252" height="34" rx="17" fill="#fff1f2" stroke="#e11d48"/>
  <text x="182" y="454" font-size="12.5" text-anchor="middle" fill="#be123c">阻断：结果不可复现</text>

  <g filter="url(#shadow)">
    <rect x="349" y="214" width="284" height="286" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="349" y="214" width="284" height="34" rx="10" fill="#2563eb"/>
    <rect x="349" y="234" width="284" height="14" fill="#2563eb"/>
  </g>
  <text x="367" y="237" font-size="15" font-weight="700" fill="#ffffff">② baseline 必须先失败</text>
  <text x="367" y="282" font-size="13.5" fill="#1f2b3a">修复前先运行验证命令</text>
  <text x="367" y="310" font-size="13.5" fill="#1f2b3a">必须确认失败才继续</text>
  <text x="367" y="338" font-size="13.5" fill="#1f2b3a">失败原因分类留档</text>
  <rect x="365" y="432" width="252" height="34" rx="17" fill="#fff1f2" stroke="#e11d48"/>
  <text x="491" y="454" font-size="12.5" text-anchor="middle" fill="#be123c">阻断：baseline 未确认失败</text>

  <g filter="url(#shadow)">
    <rect x="658" y="214" width="284" height="286" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="658" y="214" width="284" height="34" rx="10" fill="#2563eb"/>
    <rect x="658" y="234" width="284" height="14" fill="#2563eb"/>
  </g>
  <text x="676" y="237" font-size="15" font-weight="700" fill="#ffffff">③ 只允许修改源文件</text>
  <text x="676" y="282" font-size="13.5" fill="#1f2b3a">Agent 仅能修改源码实现</text>
  <text x="676" y="310" font-size="13.5" fill="#1f2b3a">契约层拦截测试文件写入</text>
  <text x="676" y="338" font-size="13.5" fill="#1f2b3a">违规调用直接拒绝并留痕</text>
  <rect x="674" y="432" width="252" height="34" rx="17" fill="#fff1f2" stroke="#e11d48"/>
  <text x="800" y="454" font-size="12.5" text-anchor="middle" fill="#be123c">阻断：修改测试制造通过</text>

  <g filter="url(#shadow)">
    <rect x="967" y="214" width="284" height="286" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="967" y="214" width="284" height="34" rx="10" fill="#2563eb"/>
    <rect x="967" y="234" width="284" height="14" fill="#2563eb"/>
  </g>
  <text x="985" y="237" font-size="15" font-weight="700" fill="#ffffff">④ 原始命令复验</text>
  <text x="985" y="282" font-size="13.5" fill="#1f2b3a">执行任务声明的原始验证命令</text>
  <text x="985" y="310" font-size="13.5" fill="#1f2b3a">记录 patch · 脱敏 trace</text>
  <text x="985" y="338" font-size="13.5" fill="#1f2b3a">记录迭代数与失败模式</text>
  <rect x="983" y="432" width="252" height="34" rx="17" fill="#fff1f2" stroke="#e11d48"/>
  <text x="1109" y="454" font-size="12.5" text-anchor="middle" fill="#be123c">阻断：结果不可复现</text>

  <g filter="url(#shadow)">
    <rect x="1276" y="214" width="284" height="286" rx="10" fill="#ffffff" stroke="#0f2540" stroke-width="2"/>
    <rect x="1276" y="214" width="284" height="34" rx="10" fill="#0f2540"/>
    <rect x="1276" y="234" width="284" height="14" fill="#0f2540"/>
  </g>
  <text x="1294" y="237" font-size="15" font-weight="700" fill="#ffffff">⑤ 判定门：计入 resolved</text>
  <text x="1294" y="282" font-size="13.5" fill="#166534">✓ baseline 确认失败</text>
  <text x="1294" y="310" font-size="13.5" fill="#166534">✓ 原始验证命令最终通过</text>
  <text x="1294" y="338" font-size="13.5" fill="#166534">✓ 未修改任何测试</text>
  <text x="1294" y="372" font-size="13" font-weight="700" fill="#0f2540">三项同时满足 ⇒ 计入 resolved</text>
  <text x="1294" y="398" font-size="12" fill="#94a3b8">否则一律不计入，不做口径放宽</text>
  <rect x="1292" y="432" width="252" height="34" rx="17" fill="#16a34a"/>
  <text x="1418" y="454" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">✓ resolved</text>

  <!-- arrows between steps -->
  <g stroke="#2563eb" stroke-width="1.8" fill="none">
    <line x1="324" y1="357" x2="347" y2="357" marker-end="url(#arrowBlue)"/>
    <line x1="633" y1="357" x2="656" y2="357" marker-end="url(#arrowBlue)"/>
    <line x1="942" y1="357" x2="965" y2="357" marker-end="url(#arrowBlue)"/>
    <line x1="1251" y1="357" x2="1274" y2="357" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- dashed arrows to evidence band -->
  <g stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" fill="none">
    <line x1="182" y1="500" x2="182" y2="526" marker-end="url(#arrow)"/>
    <line x1="800" y1="500" x2="800" y2="526" marker-end="url(#arrow)"/>
    <line x1="1418" y1="500" x2="1418" y2="526" marker-end="url(#arrow)"/>
  </g>

  <!-- Evidence band -->
  <g filter="url(#shadow)">
    <rect x="40" y="528" width="1520" height="118" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  </g>
  <text x="62" y="560" font-size="15.5" font-weight="700" fill="#0f766e">全程证据落盘：可回放 · 可审计 · 可复现</text>
  <g font-size="13" text-anchor="middle">
    <rect x="62" y="580" width="176" height="36" rx="18" fill="#ffffff" stroke="#0d9488"/>
    <text x="150" y="603" fill="#115e59">baseline 失败分类</text>
    <rect x="256" y="580" width="130" height="36" rx="18" fill="#ffffff" stroke="#0d9488"/>
    <text x="321" y="603" fill="#115e59">patch 补丁</text>
    <rect x="404" y="580" width="262" height="36" rx="18" fill="#ffffff" stroke="#0d9488"/>
    <text x="535" y="603" fill="#115e59">脱敏 trace（JSONL / Langfuse）</text>
    <rect x="684" y="580" width="176" height="36" rx="18" fill="#ffffff" stroke="#0d9488"/>
    <text x="772" y="603" fill="#115e59">迭代数 · 失败模式</text>
    <rect x="878" y="580" width="146" height="36" rx="18" fill="#ffffff" stroke="#0d9488"/>
    <text x="951" y="603" fill="#115e59">run manifest</text>
  </g>
  <text x="1056" y="590" font-size="12.5" fill="#0f766e">官方 SWE-bench-Lite Flask case 实测：baseline 确认失败 →</text>
  <text x="1056" y="612" font-size="12.5" fill="#0f766e">修复 → 原始测试通过，patch 与 trace 完整留档</text>

  <!-- Footer -->
  <rect x="40" y="674" width="1520" height="58" rx="10" fill="#0f2540"/>
  <text x="64" y="710" font-size="14" fill="#e2e8f0"><tspan font-weight="700" fill="#ffffff">口径声明：</tspan>成功率只按明确样本报告——官方 case 证明评测流程端到端可复现，不外推泛化成功率。</text>
</svg>
